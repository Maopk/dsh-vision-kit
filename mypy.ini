[mypy]
python_version = 3.12

# numpy / PIL / comtypes ship no (or partial) stubs, and this repo is a toolbox, not a
# typed library: the goal here is to catch a wrong attribute or a bad call, not to make
# every ndarray generic-exact.
ignore_missing_imports = True

# Note for readers of the diffs: `sys.stdout.reconfigure(...)` carries a
# `# type: ignore[union-attr]` because typeshed types sys.stdout as TextIO, which has no
# reconfigure() — the call is real and guarded by try/except or hasattr at every site.
#
# Run mypy ONE FILE AT A TIME (tools/ci-static.ps1 does).  Several entry points look the
# same to mypy ("Duplicate module named __main__") when passed together.
