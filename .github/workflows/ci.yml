name: checks

# Everything here avoids what only one machine has: no sample screenshot
# (tests/make-synthetic-sample.py draws one), no screen, no interpreter path baked into a script
# (CONTRIBUTING, ground rule 2).  The jobs are split by what they can honestly judge:
#
#   static            ruff, mypy (one file at a time), PSScriptAnalyzer, node --check
#   unit              tests/unit-tests.py - the headless helpers
#   detectors         the scored synthetic sample (the first check this repo ever had)
#   desktop-recorded  what needs this box's screen or its UI Automation: listed, summarised,
#                     uploaded as an artifact - recorded, never judged

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  static:
    name: ruff, mypy, PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the pinned linters
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Install PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version | Format-Table

      - name: Static checks
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci-static.ps1

  unit:
    name: unit tests (headless helpers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install numpy and Pillow (pinned, see requirements.txt)
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the unit tests
        shell: pwsh
        run: |
          python tests/unit-tests.py
          if ($LASTEXITCODE -ne 0) { throw "unit tests exited $LASTEXITCODE" }

  detectors:
    name: detectors against a synthetic sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the two libraries the tools use
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Score the detectors against a synthetic screenshot
        shell: pwsh
        run: |
          python tests/make-synthetic-sample.py out/ci-sample.png
          if ($LASTEXITCODE -ne 0) { throw "sample generation failed" }
          pwsh -NoProfile -File tests/score-pipeline.ps1 -Image out/ci-sample.png `
            -Expect 80,60,521,381 -Strict
          if ($LASTEXITCODE -ne 0) { throw "score-pipeline exited $LASTEXITCODE" }

  desktop-recorded:
    name: desktop-only checks (recorded, never judged)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write the desktop-only inventory
        shell: pwsh
        run: |
          # Two buckets, both honest: things that cannot run without this box's desktop, and
          # things that are headless but useless without a real screenshot.  The pair of lists
          # is checked against the tree, so it cannot quietly go stale.
          $desktop = @(
            @{ path = 'actor/actor.py'; why = 'the daemon itself: owns the UIA worker and the input queue'; cmd = 'python actor\actor.py' },
            @{ path = 'actor/skills/demo_calc.py'; why = 'drives Calculator through UI Automation and real input'; cmd = 'python actor\skills\demo_calc.py' },
            @{ path = 'actor/tests/dirty_calc.py'; why = 'the same end-to-end run, starting from a dirty state'; cmd = 'python actor\tests\dirty_calc.py' },
            @{ path = 'actor/tests/bench_fast.py'; why = 'latency benchmark that moves the real pointer'; cmd = 'python actor\tests\bench_fast.py' },
            @{ path = 'actor/tests/verify_type.py'; why = 'types into the focused window, then verifies through UIA'; cmd = 'python actor\tests\verify_type.py' },
            @{ path = 'actor/tests/probe_uia.py'; why = 'dumps the UI Automation tree of a target window'; cmd = 'python actor\tests\probe_uia.py' },
            @{ path = 'tools/gui-steps.ps1'; why = 'drives the DSH GUI step by step'; cmd = 'pwsh -File tools\gui-steps.ps1' },
            @{ path = 'tools/contact-send.ps1'; why = 'sends a message through a real chat window'; cmd = 'pwsh -File tools\contact-send.ps1' },
            @{ path = 'tools/ground_test.py'; why = 'asks the local Ollama model about a real screenshot'; cmd = 'python tools\ground_test.py --image shot.png' },
            @{ path = 'tools/reset-ollama.ps1'; why = 'restarts the local model service'; cmd = 'pwsh -File tools\reset-ollama.ps1' }
          )
          $shots = @(
            @{ path = 'tools/cv_ui_geometry.py'; why = 'border and blob geometry out of a screenshot'; cmd = 'python tools\cv_ui_geometry.py shot.png' },
            @{ path = 'tools/template_match.py'; why = 'NCC template match inside a screenshot'; cmd = 'python tools\template_match.py shot.png asset.png' },
            @{ path = 'tools/pixel-verdict.py'; why = 'ink/blue verdicts for the two watched boxes'; cmd = 'python tools\pixel-verdict.py shot.png' },
            @{ path = 'tools/probe_and_ocr.py'; why = 'boundary probe plus OCR crops'; cmd = 'python tools\probe_and_ocr.py shot.png' },
            @{ path = 'tools/ocr_boxes.py'; why = 'crops candidate text boxes for OCR'; cmd = 'python tools\ocr_boxes.py shot.png' },
            @{ path = 'tools/brightmap.py'; why = 'brightness map of a screenshot'; cmd = 'python tools\brightmap.py shot.png' }
          )

          $missing = @()
          foreach ($r in @($desktop) + @($shots)) {
            if (-not (Test-Path -LiteralPath $r.path)) { $missing += $r.path }
          }

          $md = @()
          $md += '# Checks that need this desktop'
          $md += ''
          $md += 'Recorded by the `desktop-recorded` job. They are not run on a runner and they are not judged: a hosted runner has no interactive session, no target windows and no UI Automation to talk to. Run them on the box that has the screen.'
          $md += ''
          $md += '| path | why it needs the desktop | how a human runs it |'
          $md += '| --- | --- | --- |'
          foreach ($r in $desktop) {
            $md += ('| `{0}` | {1} | `{2}` |' -f $r.path, $r.why, $r.cmd)
          }
          $md += ''
          $md += '## Headless, but needs a real screenshot'
          $md += ''
          $md += 'The synthetic sample in the `detectors` job covers these paths with a known box; these commands are for a real one.'
          $md += ''
          $md += '| path | what it does | how a human runs it |'
          $md += '| --- | --- | --- |'
          foreach ($r in $shots) {
            $md += ('| `{0}` | {1} | `{2}` |' -f $r.path, $r.why, $r.cmd)
          }
          $md += ''

          New-Item -ItemType Directory -Force -Path out | Out-Null
          $md -join "`n" | Set-Content -LiteralPath out/desktop-only.md -Encoding utf8
          $md -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          "desktop-only: $($desktop.Count) checks, plus $($shots.Count) that need a screenshot"
          if ($missing.Count -gt 0) {
            throw "the desktop-only list went stale, these paths are gone: $($missing -join ', ')"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-only-inventory
          path: out/desktop-only.md
          if-no-files-found: warn
