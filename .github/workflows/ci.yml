name: checks

# The first check this repo can run by itself.  Everything here avoids what only one machine
# has: no sample screenshot (tests/make-synthetic-sample.py draws one), no screen, no
# interpreter path baked into a script (see CONTRIBUTING, ground rule 2).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the two libraries the tools use
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Compile every Python file
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch '\\out\\' })
          "python files: $($files.Count)"
          python -m py_compile @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "py_compile failed" }

      - name: Score the detectors against a synthetic screenshot
        shell: pwsh
        run: |
          python tests/make-synthetic-sample.py out/ci-sample.png
          if ($LASTEXITCODE -ne 0) { throw "sample generation failed" }
          pwsh -NoProfile -File tests/score-pipeline.ps1 -Image out/ci-sample.png `
            -Expect 80,60,521,381 -Strict
          if ($LASTEXITCODE -ne 0) { throw "score-pipeline exited $LASTEXITCODE" }
